name: Sydes

on:
  pull_request:
    branches: [ "sydes-test-base" ]

permissions:
  contents: read
  pull-requests: write

jobs:
  sydes:
    uses: sydes-examples/sydes-action/.github/workflows/verify.yml@v2
    with:
      repo_alias: app
      model: openai:gpt-5.6-sol
      run_tests: true
      runtime_evidence: auto
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
